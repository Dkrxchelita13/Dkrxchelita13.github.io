<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }}">
      <span class="brand-mark" aria-hidden="true">LT</span>
      <span class="brand-name">Luz Torales</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
      <span class="sr-only">{{ if eq site.Language.Name "es" }}Abrir navegación{{ else }}Open navigation{{ end }}</span>
      <span aria-hidden="true">☰</span>
    </button>

    <nav id="primary-navigation" class="primary-navigation" aria-label="{{ if eq site.Language.Name "es" }}Navegación principal{{ else }}Primary navigation{{ end }}">
      <ul>
        {{ range site.Menus.main }}
          <li>
            <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
        {{ end }}
      </ul>

      {{ if gt (len .AllTranslations) 1 }}
        <div class="language-switcher" aria-label="{{ if eq site.Language.Name "es" }}Cambiar idioma{{ else }}Change language{{ end }}">
          {{ range .AllTranslations }}
            <a
              href="{{ .RelPermalink }}"
              lang="{{ .Language.Locale }}"
              hreflang="{{ .Language.Locale }}"
              aria-label="{{ .Language.Label }}"
              {{ if eq .Language.Name site.Language.Name }}aria-current="true"{{ end }}
            >
              {{ .Language.Name | upper }}
            </a>
          {{ end }}
        </div>
      {{ end }}
    </nav>
  </div>
</header>
